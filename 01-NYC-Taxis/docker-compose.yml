services:

  postgres:
    image: postgres:14

    environment:
      - POSTGRES_DB=db
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_USER=airflow

    volumes:
      - ./database/:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d db -U airflow"]
      interval: 5s
      retries: 5

    restart: always

  scheduler:
    build: .
    command: poetry run airflow scheduler
    restart: on-failure

    depends_on:
      - postgres

    healthcheck:
      test: ["CMD-SHELL", "poetry run airflow jobs check --job-type SchedulerJob --local || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DEBUG__FAIL_FAST=true
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:$POSTGRES_PASSWORD@postgres:5432/db
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_FOLDER=/app/airflow/dags

    volumes:
      - ./dags:/app/airflow/dags
      - ./logs:/app/airflow/logs
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro

    tty: true
    stdin_open: true

  webserver:
    build: .
    command: poetry run scripts/entrypoint.sh
    restart: on-failure

    depends_on:
      - postgres
      - scheduler

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 3

    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:$POSTGRES_PASSWORD@postgres:5432/db
      - POSTGRES_DB=db
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_USER=airflow
      - AIRFLOW__CORE__DAGS_FOLDER=/app/airflow/dags

    volumes:
      - ./dags:/app/airflow/dags
      - ./logs:/app/airflow/logs
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro

    ports:
      - "8080:8080"

    tty: true
    stdin_open: true